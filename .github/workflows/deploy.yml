name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      domains:
        description: "Custom domains (optional; falls back to the PAGES_DOMAINS repo variable)"
        required: false
        default: ""
        type: string

# One deploy at a time; a new push cancels the in-flight run.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # yarn.lock/.yarnrc.yml are gitignored in this repo, so CI installs
      # without a lockfile and resolves from package.json ranges.
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --no-immutable

      # Secrets come from Infisical when machine-identity credentials exist
      # (INFISICAL_CLIENT_ID/SECRET as GitHub secrets), otherwise straight
      # from GitHub Actions secrets. Values exported by this step
      # (NEXT_PUBLIC_SITE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
      # ...) override the GitHub secrets of the same name in the steps below.
      - name: Detect Infisical credentials
        id: infisical
        env:
          HAS_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID != '' }}
        run: echo "configured=$HAS_CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Fetch secrets from Infisical
        if: steps.infisical.outputs.configured == 'true'
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG || 'removerized' }}
          env-slug: ${{ secrets.INFISICAL_ENV_SLUG || 'prod' }}
          secret-path: ${{ secrets.INFISICAL_SECRET_PATH || '/' }}

      # Custom domains come from the dispatch input, else the PAGES_DOMAINS
      # repo variable (Settings → Secrets and variables → Actions → Variables)
      # so regular pushes attach domains too.
      - name: Build
        env:
          DOMAINS: ${{ inputs.domains || vars.PAGES_DOMAINS }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL || 'https://removerized.pages.dev' }}
        run: |
          first_domain=$(echo "$DOMAINS" | cut -d, -f1 | tr -d '[:space:]')
          if [ -n "$first_domain" ]; then
            export NEXT_PUBLIC_SITE_URL="https://$first_domain"
          fi
          yarn build

      # Any fork deploys to its own CF account: create the Pages project on
      # first run (idempotent). Name must match wrangler.toml.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/removerized")
          case "$status" in
            200) echo "Pages project 'removerized' already exists" ;;
            404) npx wrangler@4 pages project create removerized \
                   --production-branch "${{ github.event.repository.default_branch }}" ;;
            *)   echo "Unexpected API status $status"; exit 1 ;;
          esac

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy --branch "${{ github.ref_name }}"

      # Idempotent: re-attaching a domain and re-creating a CNAME are no-ops.
      # When the domain's zone lives in the same CF account the CNAME to the
      # pages.dev domain is created automatically (needs Zone:Read + DNS:Edit
      # on the token); otherwise a manual hint only.
      - name: Attach custom domains
        if: (inputs.domains || vars.PAGES_DOMAINS) != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAINS: ${{ inputs.domains || vars.PAGES_DOMAINS }}
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          pages_domain=$(curl -fsS "${auth[@]}" \
            "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/removerized" |
            jq -r '.result.domains | map(select(endswith(".pages.dev")))[0]')
          echo "Pages domain: $pages_domain"

          echo "$DOMAINS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' |
          while read -r domain; do
            echo "::group::$domain"

            curl -fsS -X POST "${auth[@]}" \
              "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/removerized/domains" \
              --data "{\"name\":\"$domain\"}" >/dev/null && echo "Domain attached to project"

            # Longest matching ancestor zone wins: sub.example.com tries
            # sub.example.com, example.com, com. No zone (or no permission)
            # degrades to a manual-setup hint.
            zone_id=""
            z="$domain"
            while [ -n "$z" ]; do
              zone_id=$(curl -sS "${auth[@]}" "$api/zones?name=$z" | jq -r '.result[0].id // empty')
              [ -n "$zone_id" ] && break
              case "$z" in *.*) z="${z#*.}" ;; *) z="" ;; esac
            done

            if [ -n "$zone_id" ]; then
              dns_id=$(curl -sS "${auth[@]}" \
                "$api/zones/$zone_id/dns_records?type=CNAME&name=$domain" |
                jq -r '.result[0].id // empty')
              if [ -n "$dns_id" ]; then
                echo "CNAME already exists"
              else
                curl -fsS -X POST "${auth[@]}" "$api/zones/$zone_id/dns_records" \
                  --data "{\"type\":\"CNAME\",\"name\":\"$domain\",\"content\":\"$pages_domain\",\"ttl\":1,\"proxied\":true}" >/dev/null
                echo "Created CNAME $domain -> $pages_domain (proxied)"
              fi
            else
              echo "::warning::No Cloudflare zone for $domain — add CNAME $domain -> $pages_domain at your DNS provider"
            fi

            echo "::endgroup::"
          done
